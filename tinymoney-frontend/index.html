<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: oklch(0.35 0.03 148.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            transition: opacity 0.4s ease;
        }
        #splash-logo {
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            line-height: 1;
            color: oklch(0.95 0.01 144.33);
        }
        #splash-logo .splash-wordmark-tiny {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }
        #splash-logo .splash-wordmark-money {
            font-family: 'Merriweather', serif;
            font-weight: 700;
        }
    </style>
    <script>
        (function () {
            const configuredTheme = localStorage.getItem('theme');
            const isDark = configuredTheme ? configuredTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>tiny Money</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap"
          rel="stylesheet">
</head>
<body>
<div id="splash">
    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="oklch(0.95 0.01 144.33)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <path d="M18.09 10.37A6 6 0 1 1 10.34 18"/>
        <path d="M7 6h1v4"/>
        <line x1="16.71" x2="18.09" y1="13.5" y2="10.37"/>
    </svg>
    <div id="splash-logo">
        <span class="splash-wordmark-tiny">tiny</span><span class="splash-wordmark-money"> Money</span>
    </div>
</div>
<div id="config-error" style="display:none;padding:2rem;font-family:sans-serif;color:#b91c1c">
    Nie można załadować konfiguracji aplikacji. Spróbuj odświeżyć stronę.
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
